name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint gettext-base
          npm install -g markdownlint-cli

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.env')
          s = p.read_text()
          replacements = {
              'admin@your-domain.com': 'ops@example.org',
              'change-me-postgres-superuser-password': 'x' * 40,
              'change-me-sub2api-postgres-password': 'y' * 40,
              'change-me-newapi-postgres-password': 'z' * 40,
              'change-me-redis-password': 'r' * 40,
              'change-me-sub2api-admin-password': 'ci-admin-pass',
              'change-me-sub2api-jwt-secret-32-bytes-minimum': 'j' * 48,
              'change-me-sub2api-totp-key-32-bytes-minimum': 't' * 48,
              'change-me-new-api-session-secret-32-bytes-minimum': 's' * 48,
              'change-me-new-api-crypto-secret-32-bytes-minimum': 'c' * 48,
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Validate environment
        run: ./scripts/validate-env.sh

      - name: Validate Compose config
        run: docker compose config

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh postgres/init/*.sh

      - name: Run YAML lint
        run: yamllint .github/workflows/ci.yml .github/dependabot.yml compose.yaml

      - name: Run Markdown lint
        run: markdownlint README.md USER_GUIDE.md PRD.md TODO.md AGENTS.md docs/*.md

      - name: Run secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
