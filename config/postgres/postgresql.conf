# PostgreSQL tuning for a small 4 GB VPS.
# Adjust only after observing workload, memory pressure, and connection counts.

listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
work_mem = 4MB
wal_buffers = 8MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
